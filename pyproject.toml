[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agentsweep"
version = "0.1.9"
description = "Find and redact secrets in AI coding agent histories (Claude Code, and more)."
readme = { file = "README.md", content-type = "text/markdown" }
license = { text = "MIT" }
# 3.11 floor: ported gitleaks rules use scoped inline flags like (?i:...),
# which Python's re only supports from 3.11.
requires-python = ">=3.11"
authors = [{ name = "agentsweep contributors" }]
keywords = ["security", "secrets", "dlp", "claude-code", "llm", "redaction", "secret-scanning", "credential-scanner", "ai-agents", "cursor", "codex", "gitleaks", "prompt-security"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: Software Development",
]
# pyahocorasick: single-pass keyword pre-filter (~4.7x scan speedup). Ships
# prebuilt wheels for Linux (manylinux x86_64/aarch64), macOS (x86_64/arm64)
# and Windows (amd64) on CPython 3.8-3.13 — no compiler needed on install.
# scanner.py degrades to a pure-Python substring fallback if it's absent.
dependencies = ["rich>=13.0", "pyahocorasick>=2.0", "argcomplete>=3.0.0"]

[project.optional-dependencies]
# Native RE2 is optional: the default install retains the stdlib scanner on
# platforms without a compatible wheel. Install with `.[fast]` to enable the
# per-rule mixed engine selected by scanner.py.
fast = [
    "google-re2>=1.1.20251105",
]

# Dev/test + code-quality tooling. These are NEVER shipped in the published
# wheel (only `dependencies` above are) — install with `pip install -e .[dev]`
# or `uv sync --extra dev`.
dev = [
    "pytest>=7.0",
    "pytest-benchmark>=4.0",  # perf-regression guard
    "mypy>=1.10",
    "pytest-cov>=5.0",
    "jsonschema>=4.0",  # spec-compliance validation for SARIF output (tests only)
    "ruff>=0.8",       # lint + format + import sort + unused-import/var (F401/F841) + complexity (C901)
    "vulture>=2.16",   # module-level dead code (unused funcs/classes Ruff's F-rules miss)
    "bandit>=1.7",     # Python SAST — fitting for a secrets-redaction tool
    "pip-audit>=2.7",  # dependency CVE scanning (SCA)
    "deptry>=0.20",    # unused / missing dependency detection
]

[project.scripts]
agentsweep = "agentsweep.cli:main"
asweep = "agentsweep.cli:main"

[project.urls]
Homepage = "https://github.com/Ishannaik/agent-sweep"
Issues = "https://github.com/Ishannaik/agent-sweep/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/agentsweep"]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/tests",
    "/LICENSE",
    "/README.md",
    "/pyproject.toml",
]

[tool.mypy]
python_version = "3.11"
files = ["src"]
ignore_missing_imports = true
warn_unused_configs = true
pretty = true

[[tool.mypy.overrides]]
module = ["agentsweep.ui.picker"]
disable_error_code = ["valid-type"]

[[tool.mypy.overrides]]
module = ["agentsweep.ui.keys"]
disable_error_code = ["attr-defined"]

[tool.coverage.run]
branch = true
source = ["agentsweep"]

[tool.coverage.report]
# Ratchet: keep this just below the current measured baseline and raise it as coverage improves.
fail_under = 74

[tool.pytest.ini_options]
# Benchmarks live under tests/ but must not run in the normal suite (they would
# add minutes to every CI leg). --benchmark-disable makes each benched function
# run once; scripts/benchmark_compare.sh passes --benchmark-only to actually time.
addopts = "--benchmark-disable"

[tool.bandit]
# CI already scopes the scan to src/ (bandit -r src/); this excludes tests/
# too for ad-hoc local runs (bandit -r .), since test fixtures are
# intentionally secret-shaped synthetic data, not a security surface.
exclude_dirs = ["tests"]

[tool.deptry]
# The dev extra is CLI-invoked tooling (pytest/ruff/vulture/bandit/pip-audit/
# deptry), not imported by src/. Telling deptry these belong to a dev group
# avoids false DEP002 "unused dependency" hits on every one of them.
optional_dependencies_dev_groups = ["dev"]
# Benchmark helpers import this project and one sibling script at runtime; the
# audit also reads the parity fixture catalogue. They are local modules, not
# third-party package dependencies.
per_rule_ignores = { DEP001 = ["benchmark_regex_engines", "test_regex_engine_parity"], DEP003 = ["agentsweep"] }
