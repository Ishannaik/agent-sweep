name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.github/ISSUE_TEMPLATE/**'
  pull_request:
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.github/ISSUE_TEMPLATE/**'

# A newer push to the same branch/PR cancels the older in-progress run, so
# rapid pushes don't pile up a queue of full matrices.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Least-privilege default: this workflow only reads the repo (checkout +
# tests). No job needs to write contents, issues, PRs, or packages.
permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Every platform agentsweep actually runs on: Linux x64 + arm64,
        # Windows x64, and macOS (Apple Silicon). It is a Python CLI, so there
        # is no iOS/Android target to test.
        os: [ubuntu-latest, ubuntu-24.04-arm, windows-latest, macos-latest]
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 1

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install package and dev dependencies
        run: pip install -e ".[dev]"

      - name: Run tests with coverage
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.13'
        run: python -m pytest tests/ -q --cov=agentsweep --cov-branch --cov-report=term-missing --cov-report=xml

      - name: Run tests
        if: matrix.os != 'ubuntu-latest' || matrix.python-version != '3.13'
        run: python -m pytest tests/ -q

      - name: Run mypy
        run: python -m mypy src/

  re2:
    name: Optional RE2 mixed engine
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 1

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
          cache: 'pip'

      - name: Install the optional mixed engine
        run: pip install -e ".[dev,fast]"

      - name: Run mixed-engine contracts
        env:
          AGENTSWEEP_REGEX_ENGINE: auto
        run: >-
          python -m pytest
          tests/test_regex_engine_parity.py
          tests/test_regex_engine_boundaries.py
          tests/test_regex_engine_concurrency.py
          tests/test_regex_engine_packaging.py
          tests/test_benchmark_harness.py -q

      - name: Generate a live compatibility audit
        env:
          AGENTSWEEP_REGEX_ENGINE: auto
        run: >-
          python scripts/audit_re2_compatibility.py
          --json /tmp/re2_compatibility.json
          --markdown /tmp/RE2_COMPATIBILITY.md

  security:
    name: Bandit SAST
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 1

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
          cache: 'pip'

      - name: Install package and dev dependencies
        run: pip install -e ".[dev]"

      - name: Run bandit
        run: python -m bandit -r src/ -q

  code-intel:
    name: Codebase intelligence (deptry + vulture)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 1

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
          cache: 'pip'

      - name: Install package and dev dependencies
        run: pip install -e ".[dev]"

      - name: Run deptry (unused / missing dependencies)
        run: python -m deptry .

      - name: Run vulture (dead code)
        run: python -m vulture src/ .vulture_whitelist.py
