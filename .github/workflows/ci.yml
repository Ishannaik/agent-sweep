name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.github/ISSUE_TEMPLATE/**'
  pull_request:
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.github/ISSUE_TEMPLATE/**'

# A newer push to the same branch/PR cancels the older in-progress run, so
# rapid pushes don't pile up a queue of full matrices.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Least-privilege default: this workflow only reads the repo (checkout +
# tests). No job needs to write contents, issues, PRs, or packages.
permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Every platform agentsweep actually runs on: Linux x64 + arm64,
        # Windows x64, and macOS (Apple Silicon). It is a Python CLI, so there
        # is no iOS/Android target to test.
        os: [ubuntu-latest, ubuntu-24.04-arm, windows-latest, macos-latest]
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 1

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install package and dev dependencies
        run: pip install -e ".[dev]"

      - name: Run tests with coverage
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.13'
        run: python -m pytest tests/ -q --cov=agentsweep --cov-branch --cov-report=term-missing --cov-report=xml

      - name: Run tests
        if: matrix.os != 'ubuntu-latest' || matrix.python-version != '3.13'
        run: python -m pytest tests/ -q

      - name: Run mypy
        run: python -m mypy src/

  lint:
    name: Lint (ruff + file length)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package and dev dependencies
        run: pip install -e ".[dev]"
      - name: Run ruff (style + complexity budgets)
        run: python -m ruff check src/
      - name: Enforce max file length
        # Ruff has no module-length rule (pylint's C0302 was never ported),
        # so this is the check. 700 is above today's worst (pipeline.py at
        # 1675 is exempted below) and below the next thing that would rot.
        run: |
          over=$(find src -name '*.py' \
            ! -path 'src/agentsweep/pipeline.py' \
            ! -path 'src/agentsweep/scanner.py' \
            ! -path 'src/agentsweep/cli.py' \
            -exec wc -l {} + | awk '$2!="total" && $1>700 {print $1"  "$2}')
          if [ -n "$over" ]; then
            echo "Files over 700 lines:"; echo "$over"; exit 1
          fi
          echo "No new oversized files."

  security:
    name: Bandit SAST
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 1

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
          cache: 'pip'

      - name: Install package and dev dependencies
        run: pip install -e ".[dev]"

      - name: Run bandit
        run: python -m bandit -r src/ -q

  code-intel:
    name: Codebase intelligence (deptry + vulture)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 1

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
          cache: 'pip'

      - name: Install package and dev dependencies
        run: pip install -e ".[dev]"

      - name: Run deptry (unused / missing dependencies)
        run: python -m deptry .

      - name: Run vulture (dead code)
        run: python -m vulture src/ .vulture_whitelist.py
